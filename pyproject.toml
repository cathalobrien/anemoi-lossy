[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anemoi-lossy"
version = "0.1.0"
description = "Per-variable lossy compression of anemoi zarr datasets"
requires-python = ">=3.10"
dependencies = ["numpy", "numcodecs"]

[project.optional-dependencies]
yaml = ["pyyaml"]
test = ["pyyaml", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

# numcodecs discovers the codec through this entry point, so zarr can decode
# the data inside anemoi-training dataloader workers without any import.
[project.entry-points."numcodecs.codecs"]
"anemoi.per_variable" = "anemoi_lossy.codec:PerVariable"
